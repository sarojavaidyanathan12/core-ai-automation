  displayName: QA Test case generator
  schemaName: crf7f_untitledagent_rGpt3k
  componentIdUnique: f451eb88-d114-448a-b482-5815640e310a
  cdsBotId: 5d714866-a06c-4c2f-b5e4-d2dd8eec5bf8
